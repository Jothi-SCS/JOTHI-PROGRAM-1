- name: Execute Student SQL
  run: |
    mysql -h127.0.0.1 -uroot -proot < starter.sql

- name: Verify Database Exists
  run: |
    mysql -h127.0.0.1 -uroot -proot -e "
    SHOW DATABASES LIKE 'CollegeDB';
    "

- name: Verify Table Exists
  run: |
    mysql -h127.0.0.1 -uroot -proot -e "
    USE CollegeDB;
    SHOW TABLES LIKE 'Department';
    "

- name: Verify Columns
  run: |
    mysql -h127.0.0.1 -uroot -proot -e "
    SELECT COLUMN_NAME
    FROM INFORMATION_SCHEMA.COLUMNS
    WHERE TABLE_SCHEMA='CollegeDB'
      AND TABLE_NAME='Department';
    "
